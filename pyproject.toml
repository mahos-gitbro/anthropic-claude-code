[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comicgen"
version = "0.1.0"
description = "Turn a story into comic book still images."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.17",
    "pillow>=10",
    "pydantic>=2",
    "resvg-py>=0.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
comicgen = "comicgen.cli:main"

[tool.setuptools]
packages = ["comicgen"]

[tool.setuptools.package-data]
comicgen = ["fonts/*"]
